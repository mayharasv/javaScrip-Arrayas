<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista</title>
        <script>
            var notas = [7, 8, 6, 9, 5]

            var soma = 0
            
            for (var nota of notas) {
                soma += nota
            }
            
            var media = soma / notas.length
            
            alert("Soma: " + soma)
            alert("Média: " + media)
        </script>
    </head>

    </body>
</html>
